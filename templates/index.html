<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecasting AI</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-6 font-sans text-white">

    <!-- Glassmorphic Container -->
    <div class="bg-white/10 backdrop-blur-md border border-white/20 rounded-3xl p-8 max-w-2xl w-full shadow-2xl">
        
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold bg-gradient-to-r from-purple-400 to-pink-400 bg-clip-text text-transparent">
                Max Planck Weather AI
            </h1>
            <p class="text-slate-300 mt-2">Time-Series Temperature Forecasting</p>
        </div>

        <!-- Input Form -->
        <div class="flex gap-4 mb-8">
            <input type="text" id="dateInput" value="2016-10-15 12:00:00" 
                   class="w-full bg-slate-800/50 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-purple-400 focus:ring-1 focus:ring-purple-400 transition"
                   placeholder="Enter Date (YYYY-MM-DD HH:MM:SS)">
            <button onclick="getPrediction()" 
                    class="bg-purple-500 hover:bg-purple-600 text-white font-semibold px-6 py-3 rounded-xl transition duration-300 ease-in-out shadow-lg shadow-purple-500/30 whitespace-nowrap">
                Predict
            </button>
        </div>

        <!-- Error Message -->
        <p id="errorMsg" class="text-red-400 text-center mb-4 hidden"></p>

        <!-- Results Section -->
        <div id="resultsArea" class="hidden">
            <div class="bg-slate-800/60 rounded-xl p-4 mb-6 text-center border border-slate-700">
                <p class="text-slate-400 text-sm">Actual Temperature</p>
                <p class="text-2xl font-bold text-green-400" id="actualTemp">-- °C</p>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <!-- Random Forest Card -->
                <div class="bg-white/5 border border-white/10 rounded-xl p-5 text-center hover:bg-white/10 transition">
                    <h3 class="text-slate-300 font-semibold mb-2">Random Forest</h3>
                    <p class="text-xl font-bold text-blue-300" id="rfTemp">-- °C</p>
                    <p class="text-xs text-slate-400 mt-2" id="rfError">Error: --</p>
                </div>
                
                <!-- XGBoost Card -->
                <div class="bg-white/5 border border-white/10 rounded-xl p-5 text-center hover:bg-white/10 transition">
                    <h3 class="text-slate-300 font-semibold mb-2">XGBoost</h3>
                    <p class="text-xl font-bold text-emerald-300" id="xgbTemp">-- °C</p>
                    <p class="text-xs text-slate-400 mt-2" id="xgbError">Error: --</p>
                </div>

                <!-- LSTM Card -->
                <div class="bg-white/5 border border-white/10 rounded-xl p-5 text-center hover:bg-white/10 transition ring-1 ring-purple-500/50 shadow-[0_0_15px_rgba(168,85,247,0.2)]">
                    <h3 class="text-slate-300 font-semibold mb-2">LSTM (Runner-up)</h3>
                    <p class="text-xl font-bold text-purple-300" id="lstmTemp">-- °C</p>
                    <p class="text-xs text-slate-400 mt-2" id="lstmError">Error: --</p>
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript to Handle API Call -->
    <script>
        async function getPrediction() {
            const dateVal = document.getElementById('dateInput').value;
            const errorMsg = document.getElementById('errorMsg');
            const resultsArea = document.getElementById('resultsArea');
            
            errorMsg.classList.add('hidden');
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ date: dateVal })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    document.getElementById('actualTemp').innerText = data.actual + " °C";
                    
                    document.getElementById('rfTemp').innerText = data.rf + " °C";
                    document.getElementById('rfError').innerText = "Error: " + Math.abs((data.actual - data.rf)).toFixed(2) + " °C";
                    
                    document.getElementById('xgbTemp').innerText = data.xgb + " °C";
                    document.getElementById('xgbError').innerText = "Error: " + Math.abs((data.actual - data.xgb)).toFixed(2) + " °C";
                    
                    document.getElementById('lstmTemp').innerText = data.lstm + " °C";
                    document.getElementById('lstmError').innerText = "Error: " + Math.abs((data.actual - data.lstm)).toFixed(2) + " °C";
                    
                    resultsArea.classList.remove('hidden');
                } else {
                    errorMsg.innerText = "Error: Invalid date or " + data.error;
                    errorMsg.classList.remove('hidden');
                    resultsArea.classList.add('hidden');
                }
            } catch (err) {
                errorMsg.innerText = "Failed to connect to the server.";
                errorMsg.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
